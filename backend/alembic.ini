# Alembic for the user-owned Supabase Postgres schema.
#
#   .venv/bin/alembic -c backend/alembic.ini upgrade head
#
# The database URL comes from DATABASE_URL (backend/.env or the environment),
# never from this file. Migrations refuse to run against a non-local host
# unless invoked with `-x allow_remote=true` (see backend/migrations/env.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
